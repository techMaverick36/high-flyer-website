<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- Favicon -->
		<link rel="icon" type="image/png" href="/logo.png" />
		<link rel="apple-touch-icon" href="/logo.png" />

		<!--
			No-JS fallback tags.

			Social crawlers (WhatsApp, Facebook, Twitter) never execute
			JavaScript, so these are the ONLY tags they see. Keep them.

			Once the app renders, react-helmet-async adds its own per-page
			copies alongside these — it manages only tags it created, so it
			cannot replace static ones (data-rh does not work for this).
			Helmet's copy is inserted first, which is the one browsers and
			Google use, so the per-page values win.

			The duplication disappears for bots the moment prerendering is
			enabled, because each route is then served HTML that already
			contains its own correct tags. Until then, removing these would
			leave shared links with no preview at all, which is worse.

			Deliberately NOT duplicated here: `robots` (absent means
			index,follow, and SEO.tsx emits noindex only where needed).
		-->
		<title>High Flyer Trading CO LTD | Premium Home Appliances in Uganda</title>
		<meta name="description" content="Uganda's most trusted home appliance showroom. Genuine refrigerators, TVs, washing machines, cookers and more. Visit us at Aponye Shopping Centre, Kampala." />
		<meta name="theme-color" content="#0891b2" />

		<link rel="canonical" href="https://highflyertadingltd.com/" />

		<!-- Open Graph defaults -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="High Flyer Trading CO LTD" />
		<meta property="og:title" content="High Flyer Trading CO LTD | Premium Home Appliances in Uganda" />
		<meta property="og:description" content="Uganda's most trusted home appliance showroom. Genuine products, expert advice, and reliable after-sales service." />
		<meta property="og:image" content="https://highflyertadingltd.com/home1.jpg" />
		<meta property="og:url" content="https://highflyertadingltd.com/" />
		<meta property="og:locale" content="en_UG" />

		<!-- Twitter Card defaults -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="High Flyer Trading CO LTD | Premium Home Appliances in Uganda" />
		<meta name="twitter:description" content="Uganda's most trusted home appliance showroom. Genuine products, expert advice, and reliable after-sales service." />
		<meta name="twitter:image" content="https://highflyertadingltd.com/home1.jpg" />

		<!-- LocalBusiness structured data -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "HomeGoodsStore",
			"name": "High Flyer Trading CO LTD",
			"description": "Uganda's trusted destination for genuine home appliances. Genuine products, expert advice, and reliable after-sales service.",
			"url": "https://highflyertadingltd.com",
			"telephone": "+256703334664",
			"email": "info@highflyertadingltd.com",
			"currenciesAccepted": "UGX",
			"paymentAccepted": "Cash, Mobile Money",
			"priceRange": "$$",
			"address": {
				"@type": "PostalAddress",
				"streetAddress": "Aponye Shopping Centre",
				"addressLocality": "Kampala",
				"addressRegion": "Central Region",
				"addressCountry": "UG"
			},
			"openingHoursSpecification": [
				{
					"@type": "OpeningHoursSpecification",
					"dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
					"opens": "08:00",
					"closes": "19:00"
				},
				{
					"@type": "OpeningHoursSpecification",
					"dayOfWeek": "Sunday",
					"opens": "10:00",
					"closes": "16:00"
				}
			],
			"sameAs": [
				"https://facebook.com/highflyertrading",
				"https://instagram.com/highflyertrading"
			],
			"image": "https://highflyertadingltd.com/home1.jpg"
		}
		</script>

		<!-- Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://api.fontshare.com/v2/css?f[]=clash-display@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
