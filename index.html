<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- Favicon -->
		<link rel="icon" type="image/png" href="/logo.png" />
		<link rel="apple-touch-icon" href="/logo.png" />

		<!--
			No-JS fallback tags.

			Social crawlers (WhatsApp, Facebook, Twitter) never execute
			JavaScript, so these are the ONLY tags they see. Keep them.

			Everything marked data-static-seo is removed by src/main.tsx
			before the app renders, and each page's SEO component then adds
			its own. Without that, Google (which does run JavaScript) sees
			two canonicals, the static "/" one first, and may ignore both.
			Helmet can't replace these itself: it manages only tags it
			created, and it appends after them rather than before.

			Deliberately NOT duplicated here: `robots` (absent means
			index,follow, and SEO.tsx emits noindex only where needed).
		-->
		<title data-static-seo>Home Appliances in Kampala, Uganda | High Flyer Trading CO LTD</title>
		<meta data-static-seo name="description" content="Shop genuine home appliances in Uganda — TVs, washing machines, blenders, air fryers and sound systems from Hisense, Midea, TCL and Philips. Cash on delivery." />
		<meta name="theme-color" content="#0891b2" />

		<link data-static-seo rel="canonical" href="https://highflyertadingltd.com/" />

		<!-- Open Graph defaults -->
		<meta data-static-seo property="og:type" content="website" />
		<meta data-static-seo property="og:site_name" content="High Flyer Trading CO LTD" />
		<meta data-static-seo property="og:title" content="Home Appliances in Kampala, Uganda | High Flyer Trading CO LTD" />
		<meta data-static-seo property="og:description" content="Uganda's most trusted home appliance showroom. Genuine products, expert advice, and reliable after-sales service." />
		<meta data-static-seo property="og:image" content="https://highflyertadingltd.com/home1.jpg" />
		<meta data-static-seo property="og:url" content="https://highflyertadingltd.com/" />
		<meta data-static-seo property="og:locale" content="en_UG" />

		<!-- Twitter Card defaults -->
		<meta data-static-seo name="twitter:card" content="summary_large_image" />
		<meta data-static-seo name="twitter:title" content="Home Appliances in Kampala, Uganda | High Flyer Trading CO LTD" />
		<meta data-static-seo name="twitter:description" content="Uganda's most trusted home appliance showroom. Genuine products, expert advice, and reliable after-sales service." />
		<meta data-static-seo name="twitter:image" content="https://highflyertadingltd.com/home1.jpg" />

		<!-- LocalBusiness structured data -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "HomeGoodsStore",
			"name": "High Flyer Trading CO LTD",
			"description": "Uganda's trusted destination for genuine home appliances. Genuine products, expert advice, and reliable after-sales service.",
			"url": "https://highflyertadingltd.com",
			"telephone": "+256703334664",
			"email": "info@highflyertadingltd.com",
			"currenciesAccepted": "UGX",
			"paymentAccepted": "Cash, Mobile Money, Bank Transfer",
			"priceRange": "$$",
			"address": {
				"@type": "PostalAddress",
				"streetAddress": "Aponye Shopping Centre",
				"addressLocality": "Kampala",
				"addressRegion": "Central Region",
				"addressCountry": "UG"
			},
			"openingHoursSpecification": [
				{
					"@type": "OpeningHoursSpecification",
					"dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
					"opens": "08:00",
					"closes": "19:00"
				},
				{
					"@type": "OpeningHoursSpecification",
					"dayOfWeek": "Sunday",
					"opens": "10:00",
					"closes": "16:00"
				}
			],
			"sameAs": [
				"https://facebook.com/highflyertrading",
				"https://instagram.com/highflyertrading"
			],
			"image": "https://highflyertadingltd.com/home1.jpg"
		}
		</script>

		<!-- Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://api.fontshare.com/v2/css?f[]=clash-display@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
